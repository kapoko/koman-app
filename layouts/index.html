{{ define "main" }}
<main class="page-shell">
    <section class="hero">
        <div class="hero-top">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"
                aria-label="Switch to light mode">
                <span class="theme-icon theme-icon-moon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M12.7 2.2a1 1 0 0 0-1.2 1.3A8.4 8.4 0 0 1 3.6 15a8.4 8.4 0 0 1 8.9 6.8 1 1 0 0 0 1 .8h.2A10.4 10.4 0 0 0 12.7 2.2Z" />
                    </svg>
                </span>
                <span class="theme-icon theme-icon-sun" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <circle cx="12" cy="12" r="4.5" />
                        <path
                            d="M12 1.8a1 1 0 0 1 1 1V5a1 1 0 0 1-2 0V2.8a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1V21a1 1 0 0 1-2 0v-2.2a1 1 0 0 1 1-1ZM4.8 4.8a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 0 1-1.4 1.4L4.8 6.2a1 1 0 0 1 0-1.4Zm11.4 11.4a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 1 1-1.4 1.4l-1.6-1.6a1 1 0 0 1 0-1.4ZM1.8 12a1 1 0 0 1 1-1H5a1 1 0 0 1 0 2H2.8a1 1 0 0 1-1-1Zm16 0a1 1 0 0 1 1-1H21a1 1 0 0 1 0 2h-2.2a1 1 0 0 1-1-1ZM4.8 19.2a1 1 0 0 1 0-1.4l1.6-1.6a1 1 0 1 1 1.4 1.4l-1.6 1.6a1 1 0 0 1-1.4 0Zm11.4-11.4a1 1 0 0 1 0-1.4l1.6-1.6a1 1 0 0 1 1.4 1.4l-1.6 1.6a1 1 0 0 1-1.4 0Z" />
                    </svg>
                </span>
            </button>
        </div>
        <h1 class="hero-title">{{ .Site.Title }}</h1>
        <p class="intro">{{ .Site.Params.intro }}</p>
    </section>

    <section class="project-grid" aria-label="Project list">
        {{ range where .Site.RegularPages "Section" "projects" }}
        <article class="project-card">
            <img class="project-logo" src="/images/{{ .Params.logo }}" alt="{{ .Title }} logo" loading="lazy" />
            <div class="project-content">
                <h2>
                    <a class="project-title-link" href="{{ .Params.project_url }}" target="_blank" rel="noopener noreferrer">{{ .Title }}</a>
                </h2>
                <p class="chip-list">{{ range .Params.tags }}<span class="chip">{{ . }}</span>{{ end }}</p>
                <p>{{ .Params.tagline }}</p>
                <a href="{{ .Params.project_url }}" target="_blank" rel="noopener noreferrer">
                    Visit {{ .Title }}
                    <span class="link-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path
                                d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm0 2a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17Z" />
                            <path
                                d="M8.8 14.2a1 1 0 0 0 1.4 1.4l4.5-4.5V14a1 1 0 1 0 2 0V8.7a1 1 0 0 0-1-1H10.4a1 1 0 1 0 0 2h2.9l-4.5 4.5Z" />
                        </svg>
                    </span>
                </a>
            </div>
        </article>
        {{ end }}
    </section>
</main>
{{ end }}
